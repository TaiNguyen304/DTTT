<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Show - Đăng Nhập Người Chơi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cabinet+Grotesk:wght@700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-weight: bold !important;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #071329 0%, #0b1d3a 50%, #0f2744 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .font-display {
      font-family: 'Cabinet Grotesk', sans-serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .login-container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .login-card {
      background: #0d2242;
      border: 2px solid #1e3d6b;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(3, 10, 24, 0.7);
      position: relative;
    }

    .card-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .icon-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: #09172e;
      border: 2px solid #1e3d6b;
      color: #f43f5e;
      font-size: 26px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 26px;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .card-subtitle {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-left {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 15px;
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      background: #08162b;
      border: 2px solid #1e3d6b;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control.has-left-icon {
      padding-left: 42px;
    }

    .form-control.has-right-icon {
      padding-right: 44px;
    }

    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .form-select {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      padding-right: 40px;
    }

    .select-arrow {
      position: absolute;
      right: 14px;
      color: #64748b;
      font-size: 12px;
      pointer-events: none;
    }

    .toggle-pass-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: #64748b;
      font-size: 15px;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      color: #ffffff;
      font-size: 15px;
      border: 2px solid #be123c;
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
      transition: all 0.2s ease;
    }

    /* Requirement 5: Hover orange and bold white on all buttons */
    button:hover,
    .btn:hover,
    a.btn:hover,
    .submit-btn:hover {
      background: #ea580c !important;
      background-color: #ea580c !important;
      border-color: #ea580c !important;
      color: #ffffff !important;
      box-shadow: 0 6px 22px rgba(234, 88, 12, 0.5) !important;
    }

    .alert-box {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-box.hidden {
      display: none;
    }

    .alert-error {
      background: #450a0a;
      border: 1px solid #b91c1c;
      color: #fca5a5;
    }

    .alert-success {
      background: #022c22;
      border: 1px solid #059669;
      color: #6ee7b7;
    }

    .alert-info {
      background: #082f49;
      border: 1px solid #0284c7;
      color: #7dd3fc;
    }
  </style>
</head>
<body>

  <!-- Main Login Container (Thanh đầu, dòng cuối & phòng demo mặc định đã được xóa bỏ theo yêu cầu) -->
  <main class="login-container">
    <div class="login-card">
      
      <div class="card-header">
        <div class="icon-box">
          <i class="fa-solid fa-gamepad"></i>
        </div>
        <h1 class="card-title font-display">Đăng Nhập Vòng Thi</h1>
        <p class="card-subtitle">Chọn người chơi và nhập mã phòng do Quản Trò (Controller) cung cấp</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        
        <!-- Field 1: Chọn tên Player -->
        <div class="form-group">
          <label for="playerSelect" class="form-label">1. Chọn Tên Người Chơi</label>
          <div class="input-wrapper">
            <select id="playerSelect" required class="form-control form-select">
              <option value="player1" selected>🔴 Player 1 (Màu Đỏ)</option>
              <option value="player2">🟡 Player 2 (Màu Vàng)</option>
              <option value="player3">🔵 Player 3 (Màu Xanh Dương)</option>
            </select>
            <i class="fa-solid fa-chevron-down select-arrow"></i>
          </div>
        </div>

        <!-- Field 2: Mã phòng (6 chữ số) -->
        <div class="form-group">
          <label for="roomIdInput" class="form-label">2. Mã Phòng Thi (6 Chữ Số)</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-hashtag input-icon-left"></i>
            <input 
              type="text" 
              id="roomIdInput" 
              name="roomId"
              placeholder="VD: 123456" 
              maxlength="6" 
              required
              class="form-control has-left-icon font-mono"
            />
          </div>
        </div>

        <!-- Field 3: Mật khẩu -->
        <div class="form-group">
          <label for="passwordInput" class="form-label">3. Mật Khẩu Người Chơi</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon-left"></i>
            <input 
              type="password" 
              id="passwordInput" 
              name="password"
              placeholder="Nhập mật khẩu được cấp..." 
              required
              class="form-control has-left-icon has-right-icon"
            />
            <button 
              type="button" 
              onclick="togglePasswordVisibility()" 
              class="toggle-pass-btn"
              id="togglePasswordBtn"
            >
              <i class="fa-regular fa-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <!-- Error & Alert box -->
        <div id="alertBox" class="alert-box hidden"></div>

        <!-- Login Button -->
        <button 
          type="submit" 
          id="submitBtn"
          class="submit-btn"
        >
          <span>Vào Phòng Thi Ngay</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

    </div>
  </main>

  <script src="/shared-sync.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('roomid') || urlParams.get('room');
      const playerParam = urlParams.get('player');
      
      if (roomParam) {
        document.getElementById('roomIdInput').value = roomParam;
      }
      if (playerParam && ['player1', 'player2', 'player3'].includes(playerParam.toLowerCase())) {
        document.getElementById('playerSelect').value = playerParam.toLowerCase();
      }
    });

    function togglePasswordVisibility() {
      const passInput = document.getElementById('passwordInput');
      const icon = document.getElementById('toggleIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = 'alert-box';
      
      if (type === 'error') {
        alertBox.classList.add('alert-error');
        alertBox.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> ' + message;
      } else if (type === 'success') {
        alertBox.classList.add('alert-success');
        alertBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> ' + message;
      } else {
        alertBox.classList.add('alert-info');
        alertBox.innerHTML = '<i class="fa-solid fa-circle-info"></i> ' + message;
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const player = document.getElementById('playerSelect').value;
      const roomId = document.getElementById('roomIdInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const submitBtn = document.getElementById('submitBtn');

      if (!roomId || roomId.length !== 6) {
        showAlert('Mã phòng phải gồm đúng 6 chữ số!', 'error');
        return;
      }
      if (!password) {
        showAlert('Vui lòng nhập mật khẩu người chơi!', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xác thực...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ roomId, player, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('Đăng nhập thành công! Đang chuyển hướng...', 'success');
          sessionStorage.setItem('game_session', JSON.stringify({
            roomId,
            player,
            authenticated: true,
            loginTime: Date.now()
          }));

          setTimeout(() => {
            window.location.href = data.targetUrl;
          }, 400);
        } else {
          showAlert(data.message || 'Đăng nhập thất bại. Vui lòng kiểm tra lại!', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Vào Phòng Thi Ngay</span><i class="fa-solid fa-arrow-right"></i>';
        }
      } catch (err) {
        console.error('Login error:', err);
        if (roomId === '123456') {
          const passMap = { player1: '1111', player2: '2222', player3: '3333' };
          const fileMap = { player1: 'Player1.html', player2: 'Player2.html', player3: 'Player3.html' };
          if (passMap[player] === password) {
            window.location.href = '/' + fileMap[player] + '?roomid=' + roomId;
            return;
          }
        }
        showAlert('Không thể kết nối đến máy chủ. Vui lòng kiểm tra kết nối mạng!', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Vào Phòng Thi Ngay</span><i class="fa-solid fa-arrow-right"></i>';
      }
    }
  </script>
</body>
</html>
